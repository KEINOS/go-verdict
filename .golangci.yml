version: "2"

run:
  tests: true
  allow-parallel-runners: true

linters:
  default: all
  disable:
    # Deprecated linters
    - wsl
    - gomodguard
    # == Project policy ==
    - depguard
    - testpackage
    # JSON of Go benchmark and tool result commonly use snake_case, so allow.
    - tagliatelle
  settings:
    paralleltest:
      ignore-missing: false
    varnamelen:
      ignore-names:
        - ok
        - t
        - tt
