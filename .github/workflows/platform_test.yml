name: Platform Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 5m

      - name: Run unit tests
        run: go test -race ./...

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run Markdown lint
        if: runner.os == 'Linux'
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'

      - name: Run E2E tests
        if: runner.os == 'Linux'
        run: make e2e
