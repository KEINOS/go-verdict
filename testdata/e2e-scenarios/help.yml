name: help
timeout: 10s

cases:
  - name: show help
    args: ["--help"]
    want:
      exit_code: 0
      stdout:
        contains:
          - "Objective benchmark decisions for Go optimization loops."
          - "Commands:"
          - "help [topic]"
          - "Options:"
          - "--require outcomes"
          - "Default: 2.0."
      stderr:
        equals: ""

  - name: show short help
    args: ["-h"]
    want:
      exit_code: 0
      stdout:
        contains:
          - "Objective benchmark decisions for Go optimization loops."
      stderr:
        equals: ""
