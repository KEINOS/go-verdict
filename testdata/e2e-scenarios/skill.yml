name: skill
timeout: 10s

cases:
  - name: show skill
    args: ["skill"]
    want:
      exit_code: 0
      stdout:
        contains:
          - "name: verdict"
          - "description:"
          - "license: MIT"
          - "author: KEINOS and The go-verdict Contributors"
          - "version:"
      stderr:
        equals: ""
