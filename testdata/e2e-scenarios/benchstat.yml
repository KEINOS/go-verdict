name: benchstat
timeout: 20s

cases:
  - name: text output from benchstat text
    args: ["--format", "text"]
    stdin_file: testdata/e2e-fixtures/benchstat_E2E.txt
    want:
      exit_code: 0
      stdout:
        matches:
          - "ExampleFast-[0-9]+: (tie|bench_(old|new)\\.txt wins)"
      stderr:
        equals: ""

  - name: verbose output from benchstat text
    args: ["--verbose", "--format", "text"]
    stdin_file: testdata/e2e-fixtures/benchstat_E2E.txt
    want:
      exit_code: 0
      stdout:
        matches:
          - "(no statistically significant practical difference|Pareto-superior)"
      stderr:
        equals: ""

  - name: json output from benchstat text
    args: ["--format", "json"]
    stdin_file: testdata/e2e-fixtures/benchstat_E2E.txt
    want:
      exit_code: 0
      stdout:
        matches:
          - '"benchmark": "ExampleFast-[0-9]+"'
      stderr:
        equals: ""

  - name: text output from benchstat csv
    args: ["--format", "text"]
    stdin_file: testdata/e2e-fixtures/benchstat_csv_E2E.txt
    want:
      exit_code: 0
      stdout:
        matches:
          - "ExampleFast-[0-9]+: (tie|bench_(old|new)\\.txt wins)"
      stderr:
        equals: ""

  - name: json output from benchstat csv
    args: ["--format", "json"]
    stdin_file: testdata/e2e-fixtures/benchstat_csv_E2E.txt
    want:
      exit_code: 0
      stdout:
        matches:
          - '"benchmark": "ExampleFast-[0-9]+"'
      stderr:
        equals: ""
