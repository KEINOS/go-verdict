name: hotspot
timeout: 120s

cases:
  - name: suggest hotspot from benchmark
    args: ["hotspot", "--bench", "BenchmarkExampleSlow", "--benchtime", "100ms", "./testdata/benchtargets"]
    want:
      exit_code: 0
      stdout:
        contains:
          - "./testdata/benchtargets: inspect"
          - "cpu-hotspot"
          - "at targets.go:"
          - "Also:"
          - "Next:"
      stderr:
        equals: ""

  - name: fall back to complexity without a benchmark
    args: ["hotspot", "--bench", "DoesNotExist", "--benchtime", "100ms", "./testdata/benchtargets"]
    want:
      exit_code: 0
      stdout:
        contains:
          - "complexity-hotspot"
          - "benchtargets.ClassifyValues"
          - "at complex.go:"
          - "static estimate, not measured cost"
          - "verdict help bootstrap"
      stderr:
        equals: ""

  - name: output hotspot json
    args:
      - "hotspot"
      - "--bench"
      - "BenchmarkExampleSlow"
      - "--benchtime"
      - "100ms"
      - "--format"
      - "json"
      - "./testdata/benchtargets"
    want:
      exit_code: 0
      stdout:
        contains:
          - '"schema_version": 2'
          - '"classification": "cpu-hotspot"'
          - '"function": "github.com/KEINOS/go-verdict/testdata/benchtargets.exampleSlow"'
          - '"file": "targets.go"'
          - '"unit": "ms"'
          - '"signals"'
          - '"candidates"'
      stderr:
        equals: ""

  - name: report only the suggestion with top 1
    args:
      - "hotspot"
      - "--bench"
      - "BenchmarkExampleSlow"
      - "--benchtime"
      - "100ms"
      - "--top"
      - "1"
      - "./testdata/benchtargets"
    want:
      exit_code: 0
      stdout:
        contains:
          - "./testdata/benchtargets: inspect"
        not_contains:
          - "Also:"
      stderr:
        equals: ""

  - name: caveat the single profiling pass
    args: ["hotspot", "--fast", "--bench", "BenchmarkExampleSlow", "--benchtime", "100ms", "./testdata/benchtargets"]
    want:
      exit_code: 0
      stdout:
        contains:
          - "./testdata/benchtargets: inspect"
          - "Caveat:"
          - "--fast"
      stderr:
        equals: ""
